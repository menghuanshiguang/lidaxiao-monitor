name: Verify Ending Metaphor (一次性, 自删)

# 一次性验证: 用仓库自己的代码 + 新提示词, 真实跑一次片尾画面识别。
# 跑完自删本文件、verify_ending_e2e.py、_selfdelete.py, 仓库回到原样。
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-ending.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install --disable-pip-version-check -r requirements.txt
        shell: pwsh

      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress
        shell: pwsh

      - name: Clone bilidown CLI
        run: git clone --depth 1 https://github.com/menghuanshiguang/bilibili-downloader-cli.git _repo

      - name: Write Bilibili cookies (与 monitor.yml 一致)
        shell: pwsh
        env:
          COOKIES_B64: ${{ secrets.BILIBILI_COOKIES_B64 }}
        run: |
          $bytes = [Convert]::FromBase64String($env:COOKIES_B64)
          New-Item -ItemType Directory -Force data | Out-Null
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.cache" | Out-Null
          [IO.File]::WriteAllBytes("$env:USERPROFILE\.cache\bilibili-login-cookies.txt", $bytes)
          [IO.File]::WriteAllBytes("data\cookies.txt", $bytes)
          Write-Host "cookies 写入完成 ($($bytes.Length) bytes)"

      - name: Verify ending metaphor
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python verify_ending_e2e.py
        shell: pwsh

      - name: 自删(无论成败都执行)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python _selfdel2.py
        shell: pwsh
