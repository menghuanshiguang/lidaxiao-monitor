name: Diag Download (一次性, 自删)

# 一次性诊断: 抓出 bilidown 下载失败的真实原因(被吞掉的异常 + CDN 真实 HTTP 状态)。
# 跑完会自行把本文件与 diag_dl.py、_selfdelete.py 从仓库删除, 仓库回到原样。
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diag-dl.yml'

permissions:
  contents: write          # 用于跑完自删

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Clone bilidown CLI
        run: git clone --depth 1 https://github.com/menghuanshiguang/bilibili-downloader-cli.git _repo

      # 与 monitor.yml 等价, 但用 $HOME 保证 Linux 下也正确
      - name: Write Bilibili cookies (等价于 monitor.yml)
        env:
          COOKIES_B64: ${{ secrets.BILIBILI_COOKIES_B64 }}
        run: |
          set -e
          if [ -z "$COOKIES_B64" ]; then echo "缺少 BILIBILI_COOKIES_B64"; exit 1; fi
          mkdir -p "$HOME/.cache" data
          printf '%s' "$COOKIES_B64" | base64 -d > "$HOME/.cache/bilibili-login-cookies.txt"
          cp "$HOME/.cache/bilibili-login-cookies.txt" data/cookies.txt
          echo "cookies 写入完成: $(wc -c < "$HOME/.cache/bilibili-login-cookies.txt") bytes"
          echo "HOME=$HOME"

      - name: Diagnose
        env:
          PYTHONIOENCODING: utf-8
        run: python diag_dl.py

      - name: 自删(无论成败都执行, 仓库回到原样)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python _selfdelete.py
