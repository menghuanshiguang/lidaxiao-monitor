name: Diag Download (一次性, 自删)

# 一次性诊断: 抓出 bilidown 下载失败的真实原因(被吞掉的异常 + CDN HTTP 状态)。
# 跑完会自行把本文件与 diag_dl.py 从仓库删除, 仓库回到原样。
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diag-dl.yml'

permissions:
  contents: write          # 用于跑完自删

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Clone bilidown CLI
        run: git clone --depth 1 https://github.com/menghuanshiguang/bilibili-downloader-cli.git _repo

      - name: Write Bilibili cookies (与 monitor.yml 完全一致)
        shell: pwsh
        env:
          COOKIES_B64: ${{ secrets.BILIBILI_COOKIES_B64 }}
        run: |
          if (-not $env:COOKIES_B64) { Write-Error "缺少 BILIBILI_COOKIES_B64" }
          $bytes = [Convert]::FromBase64String($env:COOKIES_B64)
          New-Item -ItemType Directory -Force data | Out-Null
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.cache" | Out-Null
          [IO.File]::WriteAllBytes("$env:USERPROFILE\.cache\bilibili-login-cookies.txt", $bytes)
          [IO.File]::WriteAllBytes("data\cookies.txt", $bytes)
          Write-Host "cookies 写入完成 ($($bytes.Length) bytes)"

      - name: Diagnose
        env:
          PYTHONIOENCODING: utf-8
        run: python diag_dl.py

      - name: 自删(无论成败都执行, 仓库回到原样)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os, subprocess, sys
          repo = os.environ["GITHUB_REPOSITORY"]
          files = ["diag_dl.py", ".github/workflows/diag-dl.yml"]

          def gh(args, inp=None):
              p = subprocess.run(["gh"] + args, capture_output=True, text=True,
                                 input=inp, env=os.environ)
              if p.returncode != 0:
                  print("gh 失败:", p.stderr[:300]); sys.exit(1)
              return json.loads(p.stdout) if p.stdout.strip() else None

          ref = gh(["api", "repos/%s/git/ref/heads/main" % repo])
          parent = ref["object"]["sha"]
          base = gh(["api", "repos/%s/git/commits/%s" % (repo, parent)])["tree"]["sha"]
          entries = [{"path": f, "mode": "100644", "type": "blob", "sha": None} for f in files]
          tree = gh(["api", "--method", "POST", "repos/%s/git/trees" % repo, "--input", "-"],
                    inp=json.dumps({"base_tree": base, "tree": entries}))
          c = gh(["api", "--method", "POST", "repos/%s/git/commits" % repo, "--input", "-"],
                 inp=json.dumps({"message": "清理: 删除一次性下载诊断脚本(自删)",
                                 "tree": tree["sha"], "parents": [parent]}))
          gh(["api", "--method", "PATCH", "repos/%s/git/refs/heads/main" % repo, "--input", "-"],
             inp=json.dumps({"sha": c["sha"], "force": False}))
          print("已自删, 提交:", c["sha"][:12])
          PY
