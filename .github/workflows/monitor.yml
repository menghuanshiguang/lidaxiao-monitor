name: LiDaxiao Monitor

# 定时(北京时间): 14:40 / 20:00 (北京时间 = UTC + 8)
on:
  schedule:
    - cron: '40 6 * * *'     # 14:40
    - cron: '0 12 * * *'     # 20:00
  workflow_dispatch:        # 手动触发
    inputs:
      force:
        description: '强制处理最新视频 (--force, 豁免 baseline 日期过滤)'
        type: boolean
        default: false

concurrency:
  group: lidaxiao-monitor
  cancel-in-progress: false

permissions:
  contents: write           # 允许提交报告回仓库

jobs:
  monitor:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python deps
        run: pip install --disable-pip-version-check -r requirements.txt
        shell: pwsh

      - name: Install ffmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          function Test-FFmpeg {
            try {
              & ffmpeg -version *> $null
              & ffprobe -version *> $null
              return $true
            } catch {
              return $false
            }
          }

          if (Test-FFmpeg) {
            Write-Host "ffmpeg already available"
            exit 0
          }

          # 1) Chocolatey（可能遇到源 503 / 包解析失败）
          try {
            choco install ffmpeg -y --no-progress
          } catch {
            Write-Host "choco install failed: $_"
          }
          if (Test-FFmpeg) {
            Write-Host "ffmpeg installed via choco"
            exit 0
          }

          # 2) 静态包兜底（GitHub Release，不依赖 chocolatey 源）
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $dst = Join-Path $env:RUNNER_TEMP "ffmpeg-static"
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Write-Host "choco unavailable, downloading static ffmpeg..."
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          $exe = Get-ChildItem -Path $dst -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe not found in static package" }
          $binDir = $exe.Directory.FullName
          $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$binDir;$env:PATH"

          # 3) 最终校验：装不上就让 job 失败，绝不静默
          if (-not (Test-FFmpeg)) { throw "ffmpeg/ffprobe still missing after static install" }
          & ffmpeg -version | Select-Object -First 1
          & ffprobe -version | Select-Object -First 1
          Write-Host "ffmpeg ready: $binDir"

      - name: Clone bilidown CLI
        run: |
          git clone --depth 1 https://github.com/menghuanshiguang/bilibili-downloader-cli.git _repo

      - name: Clone deepseek-chat-cli (public)
        run: |
          git clone --depth 1 https://github.com/menghuanshiguang/deepseek-chat-cli.git _repo/deepseek-chat-cli

      - name: Install deepseek-chat-cli deps
        run: pip install --disable-pip-version-check -r _repo/deepseek-chat-cli/requirements.txt
        shell: pwsh

      - name: Clone deepseek-vision-cli (public)
        run: |
          # dsv.py 驱动系统自带 Edge (playwright 客户端复用上一步安装);
          # 片尾识图第 3 级通道, DSV_TOKEN secret 未配置时自动跳过
          git clone --depth 1 https://github.com/menghuanshiguang/deepseek-vision-cli.git _repo/deepseek-vision-cli

      - name: Write Bilibili cookies (from secret)
        shell: pwsh
        env:
          COOKIES_B64: ${{ secrets.BILIBILI_COOKIES_B64 }}
        run: |
          if (-not $env:COOKIES_B64) { Write-Error "缺少 BILIBILI_COOKIES_B64 secret (B站登录cookies, base64)" }
          $bytes = [Convert]::FromBase64String($env:COOKIES_B64)
          New-Item -ItemType Directory -Force data | Out-Null
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.cache" | Out-Null
          [IO.File]::WriteAllBytes("$env:USERPROFILE\.cache\bilibili-login-cookies.txt", $bytes)
          [IO.File]::WriteAllBytes("data\cookies.txt", $bytes)
          Write-Host "cookies 写入完成 ($($bytes.Length) bytes)"

      - name: Restore state cache (last_bvid / processed / subtitles)
        uses: actions/cache@v4
        with:
          path: data/
          key: lidaxiao-data-${{ github.ref }}
          restore-keys: |
            lidaxiao-data-

      - name: Run unified monitor (local/cloud adaptive)
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSV_TOKEN: ${{ secrets.DSV_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PYTHONIOENCODING: utf-8
        run: |
          # 清理可能残留的锁
          Remove-Item data\monitor.lock -ErrorAction SilentlyContinue
          $force = "${{ github.event.inputs.force }}"
          if ($force -eq "true") { python lidaxiao.py --once --force }
          else { python lidaxiao.py --once }

      - name: Upload reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: reports/
          retention-days: 14
        if: always()
