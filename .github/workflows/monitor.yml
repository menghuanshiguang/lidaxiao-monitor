name: LiDaxiao Monitor

# 定时: 每 3 小时一次 (UTC), 一天 8 次。
# 为什么不再用两个定点: 实测云端 schedule 的 created_at 每天只落两簇, 比 cron 时刻迟 6.7-12.0 小时
#   (20 条样本: 06:40 槽迟 8.2-12.0h, 12:00 槽迟 6.7-11.4h), 还会整天缺 (2026-11-24 两格全无)。
#   延迟逐日漂移, 加固定补正修不了; 用「跑得足够密」吸收漂移比指望它按点可靠。
# 旧的两条定点 cron 保留在此作说明, 不要还原:
#     - cron: '40 6 * * *'     # 14:40 北京时间
#     - cron: '0 12 * * *'     # 20:00 北京时间
# 多跑的代价只是几次 runner 与 LLM: 链路已全幂等 —— 报告按 <!-- dynamic:id --> 判重、
#   state 只在报告写成功后才推进、视频按 BV 去重, 重复触发不产重复内容。
on:
  schedule:
    - cron: '0 */3 * * *'    # UTC 00/03/06/09/12/15/18/21 时 = 北京 08/11/14/17/20/23/02/05 时
  workflow_dispatch:        # 手动触发
    inputs:
      force:
        description: '强制处理最新视频 (--force, 豁免 baseline 日期过滤)'
        type: boolean
        default: false
      ocr_engine:
        description: 'OCR 引擎覆盖 (留空=用 config.json; rapid / xiaomi)'
        type: string
        default: ''
      llm:
        description: 'LLM 通道覆盖: free = 本次优先走本机 dsh-opencode-free 网关 (留空=默认 fallback)'
        type: string
        default: ''

concurrency:
  group: lidaxiao-monitor
  cancel-in-progress: false

permissions:
  contents: write           # 允许提交报告回仓库

jobs:
  monitor:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python deps
        run: pip install --disable-pip-version-check -r requirements.txt
        shell: pwsh

      - name: Cache Xiaomi-OCR engine
        uses: actions/cache@v4
        with:
          path: llama
          key: xiaomi-ocr-${{ runner.os }}-b12503-v2

      - name: Prepare Xiaomi-OCR engine
        shell: bash
        run: bash scripts/setup_xiaomi_ocr.sh

      - name: Install ffmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          function Test-FFmpeg {
            try {
              & ffmpeg -version *> $null
              & ffprobe -version *> $null
              return $true
            } catch {
              return $false
            }
          }

          if (Test-FFmpeg) {
            Write-Host "ffmpeg already available"
            exit 0
          }

          # 1) Chocolatey（可能遇到源 503 / 包解析失败）
          try {
            choco install ffmpeg -y --no-progress
          } catch {
            Write-Host "choco install failed: $_"
          }
          if (Test-FFmpeg) {
            Write-Host "ffmpeg installed via choco"
            exit 0
          }

          # 2) 静态包兜底（GitHub Release，不依赖 chocolatey 源）
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $dst = Join-Path $env:RUNNER_TEMP "ffmpeg-static"
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Write-Host "choco unavailable, downloading static ffmpeg..."
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          $exe = Get-ChildItem -Path $dst -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe not found in static package" }
          $binDir = $exe.Directory.FullName
          $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$binDir;$env:PATH"

          # 3) 最终校验：装不上就让 job 失败，绝不静默
          if (-not (Test-FFmpeg)) { throw "ffmpeg/ffprobe still missing after static install" }
          & ffmpeg -version | Select-Object -First 1
          & ffprobe -version | Select-Object -First 1
          Write-Host "ffmpeg ready: $binDir"

      - name: Clone bilidown CLI
        run: |
          git clone --depth 1 https://github.com/menghuanshiguang/bilibili-downloader-cli.git _repo

      - name: Clone deepseek-chat-cli (public)
        run: |
          git clone --depth 1 https://github.com/menghuanshiguang/deepseek-chat-cli.git _repo/deepseek-chat-cli

      - name: Install deepseek-chat-cli deps
        run: pip install --disable-pip-version-check -r _repo/deepseek-chat-cli/requirements.txt
        shell: pwsh

      - name: Clone deepseek-vision-cli (public)
        run: |
          # dsv.py 驱动系统自带 Edge (playwright 客户端复用上一步安装);
          # 片尾识图第 3 级通道, DSV_TOKEN secret 未配置时自动跳过
          git clone --depth 1 https://github.com/menghuanshiguang/deepseek-vision-cli.git _repo/deepseek-vision-cli

      - name: Clone opencode free gateway (public)
        run: |
          # 本机 OpenAI 兼容网关 (只在 runner 内 127.0.0.1 监听, 出站经生产 Bun worker)
          git clone --depth 1 https://github.com/menghuanshiguang/dsh-opencode-free.git _repo/dsh-opencode-free

      - name: Setup Node 24 (gateway runtime)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun (free lane transport)
        uses: oven-sh/setup-bun@v2

      - name: Transport must be the production Bun worker
        shell: bash
        run: |
          bun --version | tee bun-version.txt
          echo "OUR_FREE_MODEL_BUN=$(command -v bun)" >> "$GITHUB_ENV"
          test -x "$(command -v bun)"

      - name: Start opencode free gateway (degrade only)
        id: freegw
        shell: bash
        run: |
          # gateway.js 只 export startGateway, 没有 CLI 入口: `node src/gateway.js` 会加载完就退出,
          # 必须用 launcher 起。起不来只降级(视频链路与主通道照跑), 不 fail 整个 job。
          cd _repo/dsh-opencode-free
          cat > launch.mjs <<'JS'
          import { startGateway } from './src/gateway.js'
          const g = await startGateway({ port: 18787 })
          console.log(`free gateway listening ${g.url}`)
          JS
          node launch.mjs > /tmp/free-gateway.log 2>&1 &
          echo "GW_PID=$!" >> "$GITHUB_ENV"
          ready=false
          for i in $(seq 1 30); do
            sleep 2
            if curl -fsS --max-time 5 http://127.0.0.1:18787/v1/models > /tmp/free-models.json 2>/dev/null; then
              ready=true
              break
            fi
          done
          echo "gateway_ready=$ready" >> "$GITHUB_OUTPUT"
          cat /tmp/free-gateway.log || true
          if [ "$ready" = "true" ]; then
            echo "--- /v1/models ---"
            cat /tmp/free-models.json
          else
            echo "::warning::免费车道网关没起来, 本次降级为不用 free 通道"
          fi

      - name: Write Bilibili cookies (from secret)
        shell: pwsh
        env:
          COOKIES_B64: ${{ secrets.BILIBILI_COOKIES_B64 }}
        run: |
          if (-not $env:COOKIES_B64) { Write-Error "缺少 BILIBILI_COOKIES_B64 secret (B站登录cookies, base64)" }
          $bytes = [Convert]::FromBase64String($env:COOKIES_B64)
          New-Item -ItemType Directory -Force data | Out-Null
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.cache" | Out-Null
          [IO.File]::WriteAllBytes("$env:USERPROFILE\.cache\bilibili-login-cookies.txt", $bytes)
          [IO.File]::WriteAllBytes("data\cookies.txt", $bytes)
          Write-Host "cookies 写入完成 ($($bytes.Length) bytes)"

      - name: Restore state cache (last_bvid / processed / subtitles)
        uses: actions/cache@v4
        with:
          path: data/
          key: lidaxiao-data-${{ github.ref }}
          restore-keys: |
            lidaxiao-data-

      - name: Run unified monitor (local/cloud adaptive)
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSV_TOKEN: ${{ secrets.DSV_TOKEN }}
          # 微博访客身份 (只读时间线用). 没有该 secret 时取数降级, 不影响视频链路
          WEIBO_SUB: ${{ secrets.WEIBO_SUB }}
          GH_TOKEN: ${{ github.token }}
          PYTHONIOENCODING: utf-8
          LIDAXIAO_OCR_ENGINE: ${{ github.event.inputs.ocr_engine }}
          LIDAXIAO_LLM: ${{ github.event.inputs.llm }}
        run: |
          # 不许在这里无条件删锁: RunLock 自己带 pid 存活检查 + 陈旧超时, 预删除等于把互斥废掉。
          # 真死锁时人工确认后再删, 不在每次 run 开始时删。
          $force = "${{ github.event.inputs.force }}"
          if ($force -eq "true") {
            $b = Get-Content data\last_bvid.txt -ErrorAction SilentlyContinue
            if ($b) { Remove-Item "data\subtitles\$b.txt" -ErrorAction SilentlyContinue }
            python lidaxiao.py --once --force
          }
          else { python lidaxiao.py --once }
          # 子进程退出码必须传出去: 2026-11-26 那次 monitor 退出码=1、报告一份都没产出,
          # job 却是绿的 —— 于是 "run success" 根本不等于 "报告产出", 不翻日志就会当成通过。
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::monitor 退出码=$LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Stop opencode free gateway
        if: always()
        shell: bash
        run: |
          if [ -n "${GW_PID:-}" ]; then
            kill "$GW_PID" 2>/dev/null || true
            echo "gateway stopped (pid $GW_PID)"
          fi
          echo "--- gateway log (tail) ---"
          tail -30 /tmp/free-gateway.log 2>/dev/null || true

      - name: Upload subtitles (OCR 对比用)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subtitles-${{ github.run_id }}
          path: data/subtitles/
          retention-days: 7

      - name: Upload reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: reports/
          retention-days: 14
        if: always()
