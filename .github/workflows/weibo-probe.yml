name: weibo-probe (temporary)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: bare-python weibo probe (no cookie)
        run: |
          python3 -u - <<'PY'
          import ssl, urllib.request, urllib.error, json
          UA = ("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 "
                "(KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1")
          import sys
          print("python", sys.version.split()[0], "| openssl", ssl.OPENSSL_VERSION, flush=True)

          def get(url, extra=None, timeout=30):
              h = {"User-Agent": UA, "Accept": "application/json, text/plain, */*",
                   "Referer": "https://m.weibo.cn/u/1645823934",
                   "X-Requested-With": "XMLHttpRequest", "MWeibo-Pwa": "1"}
              if extra:
                  h.update(extra)
              req = urllib.request.Request(url, headers=h)
              try:
                  r = urllib.request.urlopen(req, timeout=timeout)
                  return r.status, dict(r.headers), r.read()
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), e.read()
              except Exception as e:
                  return None, {}, repr(e).encode()

          st, _, body = get("https://api.ipify.org?format=json")
          print(f"[egress] status={st} body={body[:120]!r}", flush=True)

          for label, url in [
              ("config", "https://m.weibo.cn/api/config"),
              ("getIndex", "https://m.weibo.cn/api/container/getIndex?type=uid&value=1645823934&containerid=1076031645823934"),
          ]:
              st, hdrs, body = get(url)
              txt = body.decode("utf-8", "replace")
              info = ""
              try:
                  j = json.loads(txt)
                  if label == "config":
                      info = f" ok={j.get('ok')} login={j.get('data',{}).get('login') if isinstance(j.get('data'),dict) else j.get('login')}"
                  else:
                      cards = (j.get("data") or {}).get("cards") or []
                      info = f" ok={j.get('ok')} cards={len(cards)}"
                      ci = (j.get("data") or {}).get("cardlistInfo") or {}
                      info += f" containerid={ci.get('containerid')} total={ci.get('total')} page={ci.get('page')}"
              except Exception:
                  pass
              print(f"[{label}] status={st} bytes={len(body)}{info} server={hdrs.get('Server')}", flush=True)
              print(f"[{label}] body[:200]={txt[:200]!r}", flush=True)
          PY
