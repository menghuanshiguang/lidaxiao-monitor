name: Published archive protection

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  archive-integrity:
    if: github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    env:
      ARCHIVE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_published_archive.py "$ARCHIVE_BASE" HEAD
