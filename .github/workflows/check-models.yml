name: Check Models (临时验证)

# 一次性验证: 用真实密钥实测新模型名是否可用。
# 验证通过后本文件与 check_models.py 将被删除。
on:
  workflow_dispatch:        # 手动触发
  push:
    paths:
      - '.github/workflows/check-models.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt

      - name: Check models (文本 + 视觉, 真实调用)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python check_models.py
