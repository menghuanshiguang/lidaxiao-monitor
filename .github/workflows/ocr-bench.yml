name: OCR Bench (Xiaomi-OCR-0)

on:
  workflow_dispatch:

jobs:
  ocr-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get llama.cpp (cpu)
        run: |
          curl -sL -o lc.tar.gz https://github.com/ggml-org/llama.cpp/releases/download/b12503/llama-b12503-bin-ubuntu-x64.tar.gz
          tar xzf lc.tar.gz
          BIN=$(find . -name llama-mtmd-cli -type f | head -1)
          [ -z "$BIN" ] && BIN=$(find . -name llama-cli -type f | head -1)
          echo "found: $BIN"
          echo "LLAMA_DIR=$PWD/$(dirname "$BIN")" >> "$GITHUB_ENV"
      - name: Download Xiaomi-OCR-0 (Q4_K_M + mmproj)
        run: |
          mkdir -p models
          curl -L --retry 3 -# -o models/xiaomi-ocr0-q4km.gguf \
            "https://huggingface.co/prithivMLmods/Xiaomi-OCR-0-GGUF/resolve/main/Xiaomi-OCR-0.Q4_K_M.gguf"
          curl -L --retry 3 -# -o models/xiaomi-ocr0-mmproj.gguf \
            "https://huggingface.co/prithivMLmods/Xiaomi-OCR-0-GGUF/resolve/main/Xiaomi-OCR-0.mmproj-bf16.gguf"
          ls -lh models/
      - name: RapidOCR baseline
        run: pip install --disable-pip-version-check -q rapidocr-onnxruntime
      - name: Run bench
        env:
          WITH_RAPIDOCR: '1'
          OCR_MODEL: models/xiaomi-ocr0-q4km.gguf
          OCR_MMPROJ: models/xiaomi-ocr0-mmproj.gguf
        run: python bench/run_ocr_bench.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-bench
          path: bench/out/
          retention-days: 7
