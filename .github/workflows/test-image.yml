name: Test Single Image

on:
  workflow_dispatch:

jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0
          python -m pip install --disable-pip-version-check -q onnxruntime numpy opencv-python-headless
      - run: python bench/test_screenshot.py --image bench/images/comment.png 2>&1 | tee out.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imgtest-${{ github.run_id }}
          path: out.log
