name: OCR A/B (same frames)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: '只跑前 N 帧 (0=全部)'
        type: string
        default: '0'

jobs:
  ab:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        shell: pwsh
        run: |
          pip install --disable-pip-version-check -q -r requirements.txt
          pip install --disable-pip-version-check -q onnxruntime

      - name: Install ffmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version | Select-Object -First 1

      - name: Cache Xiaomi-OCR engine
        uses: actions/cache@v4
        with:
          path: llama
          key: xiaomi-ocr-${{ runner.os }}-b12503-v2

      - name: Prepare Xiaomi-OCR engine
        shell: bash
        run: bash scripts/setup_xiaomi_ocr.sh

      - name: Restore data cache (frames)
        uses: actions/cache@v4
        with:
          path: data/
          key: lidaxiao-data-${{ github.ref }}
          restore-keys: |
            lidaxiao-data-

      - name: Clone bilidown CLI
        run: git clone --depth 1 https://github.com/menghuanshiguang/bilibili-downloader-cli.git _repo

      - name: Write cookies
        shell: pwsh
        env:
          COOKIES_B64: ${{ secrets.BILIBILI_COOKIES_B64 }}
        run: |
          New-Item -ItemType Directory -Force data | Out-Null
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.cache" | Out-Null
          [IO.File]::WriteAllBytes("data\cookies.txt", [Convert]::FromBase64String($env:COOKIES_B64))
          Copy-Item "data\cookies.txt" "$env:USERPROFILE\.cache\bilibili-login-cookies.txt" -Force

      - name: Fetch video + extract frames (cache miss fallback)
        shell: bash
        run: |
          if [ ! -d data/frames/BV1x3y8zpEGD ]; then
            mkdir -p data/frames/BV1x3y8zpEGD data/videos
            python _repo/bin/bilidown.py dl BV1x3y8zpEGD video data/videos mp4 480 1 || true
            ls -la data/videos
            ffmpeg -y -v error -i "$(ls data/videos/*.mp4 | head -1)" \
              -vf "fps=1/2.18" -q:v 4 data/frames/BV1x3y8zpEGD/f_%06d.jpg
          fi
          ls data/frames/BV1x3y8zpEGD | wc -l

      - name: Run A/B on same frames
        shell: bash
        run: |
          ls data/frames || true
          python bench/ab_same_frames.py --frames data/frames --bvid BV1x3y8zpEGD \
            --limit ${{ github.event.inputs.limit }} 2>&1 | tee ab.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-${{ github.run_id }}
          path: ab.log
          retention-days: 7
