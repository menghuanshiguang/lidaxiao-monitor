name: Diag Windows Download (一次性, 自删)

# 一次性诊断: 在 windows-latest 上复刻 monitor 的下载调用(monitor.yml 就是 windows runner)。
# 跑完自行删除本文件与相关脚本, 仓库回到原样。
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diag-win.yml'

permissions:
  contents: write

jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg (与 monitor.yml 完全一致)
        run: choco install ffmpeg -y --no-progress
        shell: pwsh

      - name: Clone bilidown CLI
        run: git clone --depth 1 https://github.com/menghuanshiguang/bilibili-downloader-cli.git _repo

      - name: Write Bilibili cookies (与 monitor.yml 完全一致)
        shell: pwsh
        env:
          COOKIES_B64: ${{ secrets.BILIBILI_COOKIES_B64 }}
        run: |
          if (-not $env:COOKIES_B64) { Write-Error "缺少 BILIBILI_COOKIES_B64" }
          $bytes = [Convert]::FromBase64String($env:COOKIES_B64)
          New-Item -ItemType Directory -Force data | Out-Null
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.cache" | Out-Null
          [IO.File]::WriteAllBytes("$env:USERPROFILE\.cache\bilibili-login-cookies.txt", $bytes)
          [IO.File]::WriteAllBytes("data\cookies.txt", $bytes)
          Write-Host "cookies 写入完成 ($($bytes.Length) bytes)"

      - name: Diagnose
        env:
          PYTHONIOENCODING: utf-8
        run: python diag_win.py
        shell: pwsh

      - name: 自删(无论成败都执行)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python _selfdelete.py
        shell: pwsh
