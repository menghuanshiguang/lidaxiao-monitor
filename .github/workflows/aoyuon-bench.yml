name: Aoyuon OCR Bench

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'frame=整帧(含检测) / band=只喂字幕带'
        type: choice
        options: [frame, band]
        default: frame

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0
          python -m pip install --disable-pip-version-check -q \
            onnxruntime numpy opencv-python-headless

      - name: Restore data cache (frames + subtitles)
        uses: actions/cache@v4
        with:
          path: data/
          key: lidaxiao-data-${{ github.ref }}
          restore-keys: |
            lidaxiao-data-

      - name: Bench
        run: |
          ls data/frames || true
          python bench/aoyuon_bench.py --frames data/frames --subs data/subtitles \
            --bvid BV1x3y8zpEGD --mode ${{ github.event.inputs.mode }} 2>&1 | tee bench.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aoyuon-bench-${{ github.run_id }}
          path: bench.log
          retention-days: 7
